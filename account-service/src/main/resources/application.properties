spring.application.name=account-service

# Azure Container Apps sends traffic to this port.
server.port=${PORT:8080}

# Own database and own database user (ADR-005).
# Locally the defaults match docker-compose.yml; in Azure the values come from environment variables.
spring.datasource.url=${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5433/account}
spring.datasource.username=${ACCOUNT_DB_USER:account}
spring.datasource.password=${ACCOUNT_DB_PASSWORD:account}
spring.datasource.hikari.maximum-pool-size=${ACCOUNT_DB_POOL_SIZE:5}

# The schema is created by Flyway migrations in db/migration; Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Tokens this service issues (ADR-010). The Intake Service checks issuer and audience.
carebridge.token.issuer=${ACCOUNT_TOKEN_ISSUER:carebridge-account-service}
carebridge.token.audience=carebridge
carebridge.token.lifetime=PT1H
# RSA private key (PKCS#8 PEM, or the same Base64-encoded) that signs the tokens. Kept as a secret in Azure.
# When empty, a temporary key is generated at start-up: fine locally, but every restart signs everyone out.
carebridge.token.private-key=${ACCOUNT_TOKEN_PRIVATE_KEY:}

# Brute-force protection: after this many wrong passwords the account is locked for a while.
carebridge.login.max-failed-attempts=5
carebridge.login.lock-duration=PT15M

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
