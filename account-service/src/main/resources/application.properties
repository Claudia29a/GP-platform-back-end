spring.application.name=account-service

# Azure Container Apps sends traffic to this port.
server.port=${PORT:8080}

# Own database and own database user (ADR-005).
# No fallback values: without these settings the service refuses to start, instead of quietly using the wrong
# database. Every environment sets them; ./gradlew bootRun uses application-local.properties.
spring.datasource.url=${ACCOUNT_DB_URL}
spring.datasource.username=${ACCOUNT_DB_USER}
spring.datasource.password=${ACCOUNT_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${ACCOUNT_DB_POOL_SIZE:5}

# The schema is created by Flyway migrations in db/migration; Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Tokens this service issues (ADR-010). The Intake Service checks issuer and audience.
carebridge.token.issuer=${ACCOUNT_TOKEN_ISSUER:carebridge-account-service}
carebridge.token.audience=carebridge
carebridge.token.lifetime=PT1H
# RSA private key (PKCS#8 PEM, or the same Base64-encoded) that signs the tokens. Kept as a secret in Azure.
# Required. Only local development may set it to empty: a temporary key is then generated at start-up, and every
# restart signs everyone out.
carebridge.token.private-key=${ACCOUNT_TOKEN_PRIVATE_KEY}

# Encrypts and hashes personal data in the database. Without this key the data cannot be read, so keep it safe.
carebridge.data.key=${ACCOUNT_DATA_KEY}

# Brute-force protection: after this many wrong passwords the account is locked for a while.

carebridge.login.max-failed-attempts=5
carebridge.login.lock-duration=PT15M

# Email verification: the code works for 15 minutes and for 5 tries; a new code at most once a minute and
# 5 times an hour. At most 5 accounts an hour from one IP address.
carebridge.verification.code-lifetime=PT15M
carebridge.verification.max-attempts=5
carebridge.verification.resend-interval=PT1M
carebridge.verification.max-codes-per-hour=5
carebridge.verification.max-sign-ups-per-hour=5

# Sending email (SMTP). Locally and in tests this is Mailpit, which catches every email; in production an email
# provider. The password is a secret. No fallback values: without them the service refuses to start.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
carebridge.mail.from=${MAIL_FROM}
# A mail server that is down must not make the service look unhealthy: sign-up and sign-in still work.
management.health.mail.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
