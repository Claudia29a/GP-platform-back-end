spring.application.name=intake-service

# Azure Container Apps sends traffic to this port.
server.port=${PORT:8080}

# Database (ADR-005: the Intake Service has its own database and user).
# Locally the defaults match docker-compose.yml; in Azure the values come from environment variables.
spring.datasource.url=${INTAKE_DB_URL:jdbc:postgresql://localhost:5432/intake}
spring.datasource.username=${INTAKE_DB_USER:intake}
spring.datasource.password=${INTAKE_DB_PASSWORD:intake}
# Kept small: the three services share one database server with a limited number of connections.
spring.datasource.hikari.maximum-pool-size=${INTAKE_DB_POOL_SIZE:5}

# The schema is created by Flyway migrations in db/migration; Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Login with Google Sign-In (ADR-006). The client ID is public; it tells Google which app is asking.
carebridge.security.google-client-id=${GOOGLE_CLIENT_ID:393612150902-7hrg287o9jutuqhohfm0mlnpicruur60.apps.googleusercontent.com}
# Sign-in with email and password (ADR-010): tokens from the CareBridge Account Service, checked with its public key.
carebridge.security.account-issuer=${ACCOUNT_TOKEN_ISSUER:carebridge-account-service}
carebridge.security.account-jwk-set-uri=${ACCOUNT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
# Staff allow-lists, comma separated. Set per environment; everyone not listed is a patient.
carebridge.security.gp-emails=${GP_EMAILS:}
carebridge.security.assistant-emails=${ASSISTANT_EMAILS:}

# Health checks for the platform: /actuator/health, /actuator/health/liveness and /actuator/health/readiness.
# Only "health" is exposed, and without details, so nothing about the database leaks publicly.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Not ready for traffic without a database connection; liveness stays independent so the container is not restarted for a database outage.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
