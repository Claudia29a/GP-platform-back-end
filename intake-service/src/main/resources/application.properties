spring.application.name=intake-service

# Database (ADR-005: the Intake Service has its own database and user).
# Locally the defaults match docker-compose.yml; in Azure the values come from environment variables.
spring.datasource.url=${INTAKE_DB_URL:jdbc:postgresql://localhost:5432/intake}
spring.datasource.username=${INTAKE_DB_USER:intake}
spring.datasource.password=${INTAKE_DB_PASSWORD:intake}

# The schema is created by Flyway migrations in db/migration; Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
