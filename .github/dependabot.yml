# Dependabot proposes updates as pull requests, so they go through the same tests and quality gate.
version: 2
updates:
  - package-ecosystem: gradle
    directories: ['/intake-service', '/account-service']
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups: { all: { patterns: ['*'] } }
  - package-ecosystem: docker
    directories: ['/intake-service', '/account-service']
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { all: { patterns: ['*'] } }
