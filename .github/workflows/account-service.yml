# Account Service pipeline (SAD v2, section 8.2).
# Every pull request, and every push to main: build and test. Pull requests into main and pushes to main also get the
# SonarQube Cloud analysis and its quality gate (the Free plan analyses nothing else).
# Then the end-to-end tests prove the acceptance criteria on the whole platform, and Trivy checks for known CVEs.
# Push to main, only when all of that passed: build the image, push it to GHCR and deploy to Azure.
# Actions are pinned to a full commit SHA (the version is in the comment), so a moved tag cannot change what runs.
name: account-service

on:
  # A branch is tested through its pull request; a push only starts a run on main, so nothing runs twice.
  push:
    branches: [main]
    paths:
      - 'account-service/**'
      - '.github/workflows/account-service.yml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/cve-scan.yml'
  pull_request:
    paths:
      - 'account-service/**'
      - '.github/workflows/account-service.yml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/cve-scan.yml'
  workflow_dispatch:

env:
  IMAGE: ${{ vars.IMAGE_PREFIX }}/carebridge-account-service
  CONTAINER_APP: account-service
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  # Settings of this deployment live in GitHub (Settings > Secrets and variables > Actions), not in the code.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube Cloud needs the full history to tell new code from old code.
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test
        run: ./gradlew build --console=plain
      # The Free plan of SonarQube Cloud analyses only main and pull requests into main,
      # so pushes to other branches run the tests but skip the analysis.
      - name: SonarQube Cloud analysis
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: ./gradlew sonar --console=plain
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    needs: build-and-test
    uses: ./.github/workflows/e2e.yml

  cve-scan:
    uses: ./.github/workflows/cve-scan.yml
    with:
      service: account-service

  deploy:
    needs: [build-and-test, e2e, cve-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: account-service
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # One cache per image. The runtime stage is always rebuilt, so new security updates are never skipped.
          cache-from: type=gha,scope=account-service
          cache-to: type=gha,mode=max,scope=account-service
          no-cache-filters: runtime
          pull: true
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        # Login works without a password via OpenID Connect. The IDs are secrets, so only this step gets them
        # and GitHub hides them in the logs.
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Container Apps
        run: |
          az extension add --name containerapp --upgrade --allow-preview true --only-show-errors
          if ! az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            echo "::notice::Container app $CONTAINER_APP does not exist yet; image pushed, deploy skipped."
            exit 0
          fi
          az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" -o none
          echo "Deployed $IMAGE:${{ github.sha }}"
