spring.application.name=messaging-service

# Azure Container Apps sends traffic to this port.
server.port=${PORT:8080}

# Own database and own database user (ADR-005). No fallback values: without these settings the service refuses
# to start. Every environment sets them; ./gradlew bootRun uses application-local.properties.
spring.datasource.url=${MESSAGING_DB_URL}
spring.datasource.username=${MESSAGING_DB_USER}
spring.datasource.password=${MESSAGING_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${MESSAGING_DB_POOL_SIZE:5}

# The schema is created by Flyway migrations in db/migration; Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sign-in: Google (ADR-006) and the CareBridge Account Service (ADR-010), checked exactly as in the Intake Service.
carebridge.security.google-client-id=${GOOGLE_CLIENT_ID}
carebridge.security.account-issuer=${ACCOUNT_TOKEN_ISSUER:carebridge-account-service}
carebridge.security.account-jwk-set-uri=${ACCOUNT_JWKS_URI}
# Staff allow-lists, the same as the Intake Service's: only the GP may reply.
carebridge.security.gp-emails=${GP_EMAILS:}
carebridge.security.assistant-emails=${ASSISTANT_EMAILS:}

# Encrypts and hashes personal data in this service's database. Without this key the data cannot be read.
carebridge.data.key=${MESSAGING_DATA_KEY}
# Only requests that came through the CareBridge website are accepted: its nginx sends this secret.
carebridge.gateway.secret=${GATEWAY_SECRET}

# Where the Intake Service is: it decides who may see which question.
carebridge.intake.api-url=${INTAKE_API_URL}

# Email to the patient that there is a reply (SMTP, the same provider as the Account Service). The email links to
# the site and never contains the reply. Locally and in tests Mailpit catches it.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
carebridge.mail.from=${MAIL_FROM}
carebridge.site-url=${SITE_URL}
management.health.mail.enabled=false

# Replies are deleted together with their question, 6 months after it was sent (as in the Intake Service).
carebridge.retention.question-age=183d
carebridge.retention.initial-delay=PT30S
carebridge.retention.interval=PT1H

# Health checks for the platform; only "health", without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
